services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: saas
    ports:
      - "55431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d saas"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - saas-pg:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3101:3101"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/saas
      PORT: 3101
      NODE_ENV: production
      JWT_ACCESS_SECRET: saas-demo-access-secret-change-me
      JWT_REFRESH_SECRET: saas-demo-refresh-secret-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      BCRYPT_ROUNDS: 10
      DEMO_EXPOSE_TOKENS: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  saas-pg:
